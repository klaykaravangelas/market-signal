[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketsignal"
version = "0.1.0"
description = "Reproducible market data and forecasting workflows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.1,<2",
    "exchange-calendars>=4.13,<5",
    "joblib>=1.4,<2",
    "scikit-learn>=1.7,<2",
]

[project.scripts]
marketsignal = "marketsignal.cli:main"

[project.optional-dependencies]
tracking = [
    "mlflow>=3,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/marketsignal"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
